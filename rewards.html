<!DOCTYPE html>
<html lang="en" data-theme="synthwave">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bade Bucks Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
  </head>

    <body class="min-h-screen bg-base-200">
        <!-- TOP NAVBAR -->
        <div class="navbar bg-base-300 shadow-md">
        <div class="dropdown">
            <button tabindex="0" class="btn btn-ghost btn-square">
            ☰
            </button>

            <div
            tabindex="0"
            class="dropdown-content z-10 menu p-4 shadow bg-base-100 rounded-box w-80"
            >
            <label class="form-control w-full mb-4">
                <span class="label-text">Select Child</span>
                <select id="childOption" class="select select-bordered w-full">
                <option value="">Select Child</option>
                </select>
            </label>

            <label class="form-control w-full mb-4">
                <span class="label-text">Select Week</span>
                <select id="weekOption" class="select select-bordered w-full">
                <option value="">Select Week</option>
                </select>
            </label>

            <div class="divider my-2"></div>

            <button class="btn btn-outline w-full mb-2">Add Child</button>
            <button class="btn btn-outline w-full mb-2">Settings</button>
            <button class="btn btn-outline w-full mb-2" id="resetStorage">
                Clear Selection
            </button>

            <label class="flex items-center justify-between mt-2">
                <span class="label-text">Dark Mode</span>
                <input
                id="themeToggle"
                type="checkbox"
                class="toggle toggle-primary"
                />
            </label>
            </div>
        </div>

        <div class="flex-1 justify-center">
            <h1 class="text-xl font-bold">Bade Bucks</h1>
        </div>

        <div class="flex-none"></div>
        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
